dataset: isomorph_t221
max_time_steps: 221
seed: 42
seeds:
- 42
- 123
- 2026
- 7
- 99
deterministic: true

experiment:
  name: isomorph_t221_control
  allow_execution: true
  max_gpu_runs: 20
  max_job_seconds: 7200
  max_retries_per_signature: 0
  one_active_run: true
  overall_max_seconds: 28800
  registry_path: results/isomorph_t221/experiment_registry_isomorph_t221.json
  require_archive_validation: false
  require_drive_authorization: false
  require_pushed_commit: false

data:
  processed_dir: data/isomorph
  scaler: standard
  train_ratio: 0.70
  validation_ratio: 0.15
  lookback: 14
  horizon: 7
  undirected_graph: false
  use_residual_baseline: false
  graph_edge_types:
  - directed_route
  max_time_steps: 221

training:
  batch_size: 4
  epochs: 100
  patience: 15
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  loss: huber
  huber_delta: 1.0
  scheduler_factor: 0.5
  scheduler_patience: 8

models:
  temporal_only:
    d_model: 64
    temporal_heads: 2
    spatial_heads: 4
    dropout: 0.30
  stgt:
    d_model: 64
    temporal_heads: 2
    spatial_heads: 4
    dropout: 0.30
  stgt_permuted:
    d_model: 64
    temporal_heads: 2
    spatial_heads: 4
    dropout: 0.30
  adaptive_stgt:
    d_model: 64
    temporal_heads: 2
    spatial_heads: 4
    dropout: 0.30

outputs:
  checkpoint_dir: results/isomorph_t221/checkpoints
  metrics_dir: results/isomorph_t221/metrics
  predictions_dir: results/isomorph_t221/predictions
  logs_dir: results/isomorph_t221/logs
  drive_artifact_root: results/isomorph_t221
